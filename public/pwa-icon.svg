<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#040B16"/>
      <stop offset="100%" stop-color="#02050B"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDB4C7"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A47DAB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(164,125,171,0.3)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="rgba(164,125,171,0.12)" filter="url(#glow)"/>

  <!-- Lycoris Stylized Floral Petals -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- 6 Stylized Petals radiating outward -->
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95"/>
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95" transform="rotate(60)"/>
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95" transform="rotate(120)"/>
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95" transform="rotate(180)"/>
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95" transform="rotate(240)"/>
    <path d="M0,0 Q-30,-90 -10,-150 Q10,-90 0,0" fill="url(#petalGrad)" opacity="0.95" transform="rotate(300)"/>

    <!-- Filaments / Stamens (Distinctive characteristic of Spider Lily / Lycoris) -->
    <path d="M0,0 Q-40,-120 -80,-170" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-80" cy="-170" r="5" fill="#EDB4C7"/>

    <path d="M0,0 Q40,-120 80,-170" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="80" cy="-170" r="5" fill="#EDB4C7"/>

    <path d="M0,0 Q-120,-40 -170,-80" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-170" cy="-80" r="5" fill="#EDB4C7"/>

    <path d="M0,0 Q120,-40 170,-80" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="170" cy="-80" r="5" fill="#EDB4C7"/>

    <path d="M0,0 Q-70,100 -120,150" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-120" cy="150" r="5" fill="#EDB4C7"/>

    <path d="M0,0 Q70,100 120,150" stroke="#EDB4C7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="120" cy="150" r="5" fill="#EDB4C7"/>

    <!-- Center Core -->
    <circle cx="0" cy="0" r="20" fill="#f2f2f2"/>
    <circle cx="0" cy="0" r="12" fill="#A47DAB"/>
  </g>
</svg>
